<div class="forgot-container">

    <div class="forgot-card">

        <!-- LOGO -->

        <div class="brand">

            <img
                src="images/logo.png"
                alt="Swaad Junction">

            <h2>Swaad Junction</h2>

        </div>


        <!-- =================================================
             STEP 1 : EMAIL
        ================================================== -->

        <div *ngIf="step === 1">

            <h3>Forgot Password?</h3>

            <p class="description">

                Enter your registered email address and
                we'll send you an OTP to reset your password.

            </p>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    class="form-control"
                    [(ngModel)]="email"
                    placeholder="Enter your email">

            </div>


            <button
                class="btn-primary"
                (click)="sendOtp()"
                [disabled]="loading">

                {{ loading ? 'Sending OTP...' : 'Send OTP' }}

            </button>


            <button
                class="btn-link"
                (click)="backToLogin()">

                ← Back to Login

            </button>

        </div>


        <!-- =================================================
             STEP 2 : OTP
        ================================================== -->

        <div *ngIf="step === 2">

            <h3>Verify OTP</h3>

            <p class="description">

                OTP has been sent to

                <strong>{{ email }}</strong>

            </p>


            <div class="form-group">

                <label>Enter OTP</label>

                <input
                    type="text"
                    class="form-control otp-input"
                    [(ngModel)]="otp"
                    maxlength="6"
                    placeholder="Enter 6-digit OTP">

            </div>


            <button
                class="btn-primary"
                (click)="verifyOtp()"
                [disabled]="loading">

                {{ loading ? 'Verifying...' : 'Verify OTP' }}

            </button>


            <button
                class="btn-link"
                (click)="step = 1">

                ← Change Email

            </button>

        </div>


        <!-- =================================================
             STEP 3 : RESET PASSWORD
        ================================================== -->

        <div *ngIf="step === 3">

            <h3>Create New Password</h3>

            <p class="description">

                Create a new password for your
                Swaad Junction account.

            </p>


            <div class="form-group">

                <label>New Password</label>

                <input
                    type="password"
                    class="form-control"
                    [(ngModel)]="newPassword"
                    placeholder="Enter new password">

            </div>


            <div class="form-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    class="form-control"
                    [(ngModel)]="confirmPassword"
                    placeholder="Confirm new password">

            </div>


            <button
                class="btn-primary"
                (click)="resetPassword()"
                [disabled]="loading">

                {{ loading ? 'Updating...' : 'Reset Password' }}

            </button>

        </div>


        <!-- SLOGAN -->

        <p class="slogan">

            🍲 Every Bite Feels Like Home

        </p>

    </div>

</div>
